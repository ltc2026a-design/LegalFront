[package]
name = "consulta-legal-desktop"
version = "1.0.0"
description = "Consulta Legal - app de escritorio (Tauri, Zona 10)"
authors = ["Sistema de Consulta Legal"]
edition = "2021"
rust-version = "1.77.2"

# El nombre de la lib se usa tanto en el entrypoint de escritorio (main.rs) como
# en el de movil. Cambiarlo obliga a actualizar main.rs.
[lib]
name = "consulta_legal_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Plugins declarados en capabilities/default.json (core + notification + http).
tauri-plugin-notification = "2"
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
